<header class="site">
  <div class="bar">
    <a class="logo" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} - início">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="#0a7d4f"/><text x="14" y="18.5" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">CPF</text></svg>
      <span>{{ site.Title }}</span>
    </a>
    <nav aria-label="Principal"><ul>
      {{ $page := . }}
      {{ range site.Menus.main }}<li><a href="{{ .URL }}"{{ if or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>{{ end }}
    </ul></nav>
  </div>
</header>
