{{- $client := site.Params.adsenseClient -}}
{{- if $client -}}
<div class="ad"><span class="ad-label">Publicidade</span><ins class="adsbygoogle" style="display:block" data-ad-client="{{ $client }}" data-ad-slot="{{ .slot }}" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
{{- else if hugo.IsServer -}}
<div class="ad ad-empty">Espaço para anúncio</div>
{{- end -}}
