{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<div class="prose page">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="posts">{{ range .Pages.ByDate.Reverse }}<li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }}<span class="mu small">{{ . }}</span>{{ end }}</li>{{ end }}</ul>
</div>
{{ end }}
