baseURL = "https://junaisasan.github.io/"
languageCode = "pt-BR"
defaultContentLanguage = "pt-br"
title = "Gerador de CPF"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
  description = "Gerador de CPF online: gere um CPF válido e aleatório, com ou sem pontuação e por estado."
  # AdSense: preencha depois da aprovação (ex.: ca-pub-1234567890123456)
  adsenseClient = ""
  adSlotTop = ""
  adSlotBottom = ""

[params.author]
  # Kosong = memakai nama situs sebagai Organization. Isi nama Anda jika type = "Person".
  name = ""
  type = "Organization"

[[menus.main]]
  name = "Estatísticas"
  pageRef = "/estatisticas"
  weight = 1
[[menus.main]]
  name = "Glossário"
  pageRef = "/glossario"
  weight = 2

# Links do rodapé (Sobre, Contato, Privacidade) - usados em layouts/partials/footer.html
[[menus.footer]]
  name = "Sobre"
  pageRef = "/sobre"
  weight = 1
[[menus.footer]]
  name = "Contato"
  pageRef = "/contato"
  weight = 2
[[menus.footer]]
  name = "Política de Privacidade"
  pageRef = "/politica-de-privacidade"
  weight = 3

[markup.highlight]
  codeFences = false
  guessSyntax = false

[markup.goldmark.renderer]
  unsafe = true

[imaging]
  quality = 80
  hint = "photo"
